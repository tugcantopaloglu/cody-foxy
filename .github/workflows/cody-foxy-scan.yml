name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install security tools
        run: pip install semgrep bandit==1.9.4
      - name: Generate Semgrep report
        run: semgrep scan --config p/security-audit --config p/secrets --sarif --output results.sarif backend/app frontend/src
      - name: Check high severity Python findings
        run: bandit -r backend/app -lll -f json -o bandit-report.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            results.sarif
            bandit-report.json
          if-no-files-found: error
